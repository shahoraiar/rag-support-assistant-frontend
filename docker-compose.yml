# Local: frontend in Docker, talking to Django on the host (backend docker compose / runserver).
# Port 5173 matches the backend's local CORS_ALLOWED_ORIGINS.
services:
  frontend:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: supportai_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
